name: Publish watchdog

# Safety net for the daily 6 PM blog publish. It never writes an article itself.
#  - primary scheduler (cron-job.org -> daily-seo.yml) did not start a run by 18:30 Chicago  -> start one
#  - the run failed, or finished green but published nothing                               -> retry at 20:00 and 22:00 Chicago
#  - still nothing after the retries, or the owner must act (expired token, no credit)     -> open ONE issue per day (GitHub notifies
#    the owner); the issue closes itself when a later run publishes
#  - an article recorded as published is not live at its URL                                -> alert
# Retries are dispatches of the normal daily-seo.yml, which has its own 1-article/day limit, concurrency group and
# post-rebase re-check, so a retry can never create a duplicate article.
# GitHub's cron is NOT reliable for this repo (Nov 19: a scheduled run started 9.5 hours late; scheduled runs were absent
# for days), so critical retries never depend on it. Three independent starters; all are safe to overlap:
#   1. the 6 PM daily-seo run starts this workflow in LOOP mode (polls every 3 min until 22:50 Chicago)  <- primary
#   2. an optional second cron-job.org job (POST workflow_dispatch with loop=true, dry_run=false at ~18:25 Chicago)
#   3. GitHub cron below, best effort only
# The Python logic uses Chicago wall time, so daylight saving needs no change. Concurrency lets only one loop run.

on:
  schedule:
    - cron: "35 23,0,1,2,3,4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print decisions only: dispatch nothing, alert nothing"
        type: boolean
        default: true
      loop:
        description: "Keep polling every 3 minutes until the day is resolved or 22:50 Chicago"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: publish-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Evaluate today's publish
        working-directory: seo-agent
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.loop }}" = "true" ]; then args="$args --loop"; fi
          python -m seo_agent.publish_monitor watchdog $args
