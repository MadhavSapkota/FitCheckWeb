name: Daily SEO agent

on:
  schedule:
    - cron: "17 6 * * *"   # once a day, 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no file changes, no commit, no deploy)"
        type: boolean
        default: false

# Minimal permissions: push content + trigger the existing Pages workflow.
permissions:
  contents: write
  actions: write

# Never run two SEO jobs at once (prevents duplicate publishing).
concurrency:
  group: daily-seo-agent
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r seo-agent/requirements.txt

      - name: Unit tests (offline, mocked APIs)
        working-directory: seo-agent
        run: python -m pytest -q tests

      - name: Run SEO agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        working-directory: seo-agent
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m seo_agent.main run --dry-run
          else
            python -m seo_agent.main run
          fi

      - name: Validate site (build test)
        if: ${{ inputs.dry_run != true }}
        working-directory: seo-agent
        run: python -m seo_agent.main check

      - name: Commit and push changes
        id: commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "seo-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ONLY paths the agent owns or may safely edit.
          git add blog sitemap.xml robots.txt seo-agent/data index.html how-it-works.html privacy.html terms.html
          if git diff --cached --quiet; then
            echo "No changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "SEO agent: daily update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          (cd seo-agent && python -m seo_agent.main check)
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # existing GitHub Pages deployment explicitly.
      - name: Deploy via existing Pages workflow
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_id }}
          path: |
            seo-agent/data/reports/
            seo-agent/data/logs/
          if-no-files-found: ignore
          retention-days: 30
