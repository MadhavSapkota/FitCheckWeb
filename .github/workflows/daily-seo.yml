name: Daily SEO agent

on:
  # cron-job.org can still dispatch the primary 6 PM Chicago run. GitHub supplies
  # independent hourly backup attempts between 18:17 and 22:17 Chicago (both DST offsets).
  schedule:
    - cron: "17 23,0,1,2,3,4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no file changes, no commit, no deploy)"
        type: boolean
        default: false
      discovery_only:
        description: "Discovery only: query every market and print the keyword report. Publishes/saves/commits nothing, ignores the daily limit"
        type: boolean
        default: false
      keyword:
        description: "Re-test one keyword (optional, bypasses the 30-day rejection cooldown)"
        type: string
        default: ""

# Minimal permissions: push content + trigger the existing Pages workflow.
permissions:
  contents: write
  actions: write

# Never run two SEO jobs at once (prevents duplicate publishing).
concurrency:
  group: daily-seo-agent
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.time.outputs.due }}
    steps:
      - name: Select Chicago publishing hours
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          due=true
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$(TZ=America/Chicago date +%H)" in
              18|19|20|21|22) ;;
              *) due=false ;;
            esac
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

  seo:
    needs: schedule
    if: ${{ needs.schedule.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # global discovery searches ~14 markets
    steps:
      # Check out the LATEST branch head (not the commit that triggered the run), so a run queued behind another
      # (concurrency group) sees that run's published article and the 1-article/day limit holds.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Start the watchdog loop (retries at 20:00/22:00 + issue alerts). Independent of GitHub's unreliable cron: it is started
      # by this run itself. Best effort: a failure here must never block publishing.
      - name: Start watchdog loop
        if: ${{ inputs.dry_run != true && inputs.discovery_only != true && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-watchdog.yml --ref master -f loop=true -f dry_run=false

      # The 1-article/day limit counts days in Chicago time, so it stays correct across daylight saving changes.
      - name: Set local date
        run: echo "SEO_AGENT_TODAY=$(TZ=America/Chicago date +%F)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r seo-agent/requirements.txt

      - name: Unit tests (offline, mocked APIs)
        working-directory: seo-agent
        run: python -m pytest -q tests

      - name: Run SEO agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          FORCE_KEYWORD: ${{ inputs.keyword }}
        working-directory: seo-agent
        run: |
          if [ "${{ inputs.discovery_only }}" = "true" ]; then python -m seo_agent.main discover; exit $?; fi
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${GITHUB_REF}" != "refs/heads/master" ]; then args="--dry-run"; fi
          if [ -n "$FORCE_KEYWORD" ]; then
            python -m seo_agent.main run $args --keyword "$FORCE_KEYWORD"
          else
            python -m seo_agent.main run $args
          fi

      # Publishing only ever happens from master. On any other branch the run is forced to behave like a dry run
      # after the agent step: no commit, no push, no deploy.
      - name: Validate site (build test)
        if: ${{ inputs.dry_run != true && inputs.discovery_only != true && github.ref == 'refs/heads/master' }}
        working-directory: seo-agent
        run: python -m seo_agent.main check

      - name: Commit and push changes
        id: commit
        if: ${{ inputs.dry_run != true && inputs.discovery_only != true && github.ref == 'refs/heads/master' }}
        run: |
          git config user.name "seo-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ONLY paths the agent owns or may safely edit.
          git add blog sitemap.xml robots.txt seo-agent/data index.html how-it-works.html privacy.html terms.html
          # Feature landing pages: only staged when they already exist in the repo (owner-approved, committed by hand).
          for d in ai-outfit-checker ai-makeup-assistant ai-hairstyle-try-on digital-wardrobe virtual-outfit-try-on ai-skin-analysis; do
            if git ls-files --error-unmatch "$d/index.html" >/dev/null 2>&1; then git add "$d/index.html"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "SEO agent: daily update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          # Re-validate AFTER merging the latest remote state: fails (no push) if this would make 2 articles today.
          (cd seo-agent && python -m seo_agent.main check)
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # existing GitHub Pages deployment explicitly.
      - name: Deploy via existing Pages workflow
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}"

      # Confirms today's new/updated article URLs are live (HTTP 200 + correct canonical) after the Pages deploy.
      # Bounded polling with backoff (max 15 min). This checks deployment only; it never claims Google indexing.
      - name: Verify deployment
        id: verify
        if: ${{ steps.commit.outputs.changed == 'true' }}
        working-directory: seo-agent
        run: python -m seo_agent.main verify --wait 900

      # Permanent publishing history: one row per run (published / skipped + reason / failed), always recorded, so a
      # "green" run that published nothing is visible. Built from this run's state, then applied on a clean copy of
      # origin/master so a failed run can never push half-finished files.
      - name: Record publishing history
        if: ${{ always() && inputs.dry_run != true && inputs.discovery_only != true && github.ref == 'refs/heads/master' }}
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "seo-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export ARTICLE_COMMIT="$(git rev-parse HEAD)"
          (cd seo-agent && python -m seo_agent.publish_monitor record --emit "$RUNNER_TEMP/record.json")
          for i in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            (cd seo-agent && python -m seo_agent.publish_monitor record --apply "$RUNNER_TEMP/record.json")
            git add seo-agent/data/publish-history.json seo-agent/data/PUBLISH-HISTORY.md
            git commit -m "Publishing history: $(date -u +%F) run ${GITHUB_RUN_ID}" || exit 0
            git push origin HEAD:master && exit 0
            sleep 5
          done
          echo "::error::could not push publishing history"; exit 1

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_id }}
          path: |
            seo-agent/data/reports/
            seo-agent/data/logs/
            seo-agent/data/drafts/
          if-no-files-found: ignore
          retention-days: 30

      # A successful process is not a successful daily publish. Run this after
      # history/report persistence so rejected topics survive into the next retry.
      - name: Require today's article
        if: ${{ success() && inputs.dry_run != true && inputs.discovery_only != true && github.ref == 'refs/heads/master' }}
        working-directory: seo-agent
        run: |
          python - <<'PY'
          from seo_agent.config import load_config
          from seo_agent.state import State, today
          state = State(load_config().data_dir / "state.json")
          if not state.published_today():
              reason = (state.data.get("runs") or [{}])[-1].get("decision", "no article recorded")
              print(f"::error::No article published for {today()}: {reason}")
              raise SystemExit(1)
          print(f"Daily article recorded for {today()}")
          PY
