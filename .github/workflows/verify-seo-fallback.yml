name: One-time verify and merge (seo-fallback-test)

# TEMPORARY. Fires once (Nov 19 2026, 00:17 America/Chicago = 06:17 UTC), verifies the pinned commit of branch
# seo-fallback-test end to end with the REAL Claude pipeline in dry-run mode, and merges it into master ONLY if every check
# passes. GitHub only runs scheduled workflows from the default branch, which is why this file lives on master.
# Safe to delete after the run. Manual (workflow_dispatch) runs are rehearsals: they can never merge or create issues.
on:
  schedule:
    - cron: "17 6 19 11 *"   # yearly on Nov 19; the date guard below makes every run except 2026-11-19 (Chicago) a no-op
  workflow_dispatch: {}

permissions:
  contents: write   # tag claim + merge push to master (never touches .github/workflows: GITHUB_TOKEN cannot, and the job refuses to)
  issues: write     # report PASS/FAIL as an issue on scheduled runs

# Shares the production group: never overlaps a daily SEO run, never runs twice at once.
concurrency:
  group: daily-seo-agent
  cancel-in-progress: false

env:
  VERIFY_DATE: "2026-11-19"                                    # Chicago date this verification is allowed to run
  BRANCH: seo-fallback-test
  EXPECTED_BRANCH_SHA: e2154fafaded884c073a513e46273a54aba8031b # the reviewed commit; any other tip aborts the run
  BASE_SHA: 71353c61da47207d1ac72a40d797a6849b03ca19            # master tip the branch was cut from

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Claim (date guard + one-time tag)
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          if [ "$EVENT" = "schedule" ]; then
            if [ "$(TZ=America/Chicago date +%F)" != "$VERIFY_DATE" ]; then echo "Not $VERIFY_DATE in Chicago: nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            TAG="verify-seo-fallback-$VERIFY_DATE"
            if git ls-remote --exit-code --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Already claimed ($TAG): duplicate trigger, nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/$TAG" -f "sha=${GITHUB_SHA}" >/dev/null   # atomic: a second run fails here
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Check out the branch under test
        if: steps.claim.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Pin - tip must be the reviewed commit
        if: steps.claim.outputs.go == 'true'
        run: |
          set -e
          [ "$(git rev-parse HEAD)" = "$EXPECTED_BRANCH_SHA" ] || { echo "::error::Branch tip $(git rev-parse HEAD) is not the reviewed commit $EXPECTED_BRANCH_SHA. Aborting without merge."; exit 1; }
          echo "# Verification of $EXPECTED_BRANCH_SHA" > summary.md
          echo "SEO_AGENT_TODAY=$(TZ=America/Chicago date +%F)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: steps.claim.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo-agent/requirements.txt

      - name: Install dependencies
        if: steps.claim.outputs.go == 'true'
        run: pip install -r seo-agent/requirements.txt

      - name: Full test suite (offline, mocked APIs)
        if: steps.claim.outputs.go == 'true'
        working-directory: seo-agent
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee ../pytest.log
          echo "- Full test suite: PASSED ($(tail -1 ../pytest.log))" >> ../summary.md

      - name: End-to-end DRY RUN with the real Claude pipeline (publishes nothing)
        if: steps.claim.outputs.go == 'true'
        id: dry
        working-directory: seo-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          set +e
          python -m seo_agent.main run --dry-run > ../agent.log 2>&1     # --dry-run is hard-coded: no article, no state, no commit
          echo "exit=$?" >> ../agent.log
          set -e
          cd ..
          # a dry run must leave the checkout untouched
          git diff --quiet || { echo "::error::dry run modified tracked files"; git diff --stat; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard blog seo-agent/data sitemap.xml index.html)" ] || { echo "::error::dry run created site/state files"; exit 1; }
          DECISION=$(grep -m1 '^\*\*Decision:\*\*' agent.log || true)
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          echo "- Decision line: \`${DECISION}\`" >> summary.md

      - name: Evaluate dry-run result
        if: steps.claim.outputs.go == 'true'
        env:
          STRICT: ${{ github.event_name == 'schedule' }}
        run: |
          fail() { echo "- FAILED: $1" >> summary.md; echo "::error::$1"; exit 1; }
          grep -q "^exit=0" agent.log || fail "agent exited non-zero"
          grep -q "^## Errors" agent.log && fail "report contains an Errors section"
          grep -q "Global discovery: 10 markets" agent.log || fail "not all 10 markets were queried"
          grep -qE "markets? failed|market [A-Z]{2} failed" agent.log && fail "a market failed (Keyword Planner error)"
          echo "- Keyword Planner: 10 markets queried, no market failures" >> summary.md
          if grep -q "FALLBACK clusters" agent.log; then echo "- Fallback discovery ran (primary pass produced no article)" >> summary.md; else echo "- Fallback not needed (primary pass produced the article)" >> summary.md; fi
          LINE=$(grep -m1 '^\*\*Decision:\*\*' agent.log)
          N=$(echo "$LINE" | grep -o "\[dry-run\] would publish" | wc -l | tr -d ' ')
          if [ "$N" = "1" ]; then
            echo "- RESULT: exactly one article reached 'would publish' after the real planner, writer, reviewer and quality gate" >> summary.md
          elif [ "$STRICT" = "true" ]; then
            fail "no keyword reached 'would publish' (decision: $LINE)"
          else
            echo "- Rehearsal: no 'would publish' (expected today if the daily slot is used). Decision: $LINE" >> summary.md
          fi
          [ "$N" -le 1 ] || fail "more than one article would be published (limit is 1/day)"

      - name: Merge the verified code into master (scheduled run only)
        if: success() && github.event_name == 'schedule' && steps.claim.outputs.go == 'true'
        run: |
          set -e
          fail() { echo "- NOT MERGED: $1" >> summary.md; echo "::error::$1"; exit 1; }
          git config user.name "seo-agent[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin master
          TIP=$(git rev-parse origin/master)
          [ "$TIP" = "$GITHUB_SHA" ] || fail "master changed during verification ($GITHUB_SHA -> $TIP); leaving the branch for review"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$TIP")
          [ "$CHANGED" = ".github/workflows/verify-seo-fallback.yml" ] || fail "master has unreviewed changes since the base commit: $CHANGED"
          git checkout -q -B merge-verified "$TIP"
          git merge --squash "origin/$BRANCH" >/dev/null
          git checkout "$TIP" -- .github/workflows/daily-seo.yml          # keep master's workflow files: GITHUB_TOKEN cannot push workflow changes
          BAD=$(git diff --cached --name-only | grep -v '^seo-agent/' || true)
          [ -z "$BAD" ] || fail "merge would touch files outside seo-agent/: $BAD"
          # the staged tree must equal the verified commit apart from the two workflow files
          DIFF=$(git diff --cached --name-only "origin/$BRANCH" | sort | tr '\n' ' ')
          [ "$DIFF" = ".github/workflows/daily-seo.yml .github/workflows/verify-seo-fallback.yml " ] || fail "staged tree differs from the verified commit: $DIFF"
          git commit -q -m "SEO agent: verified global discovery, competitor-brand routing, informational seeds, fallback discovery" \
            -m "Squash of $BRANCH @ $EXPECTED_BRANCH_SHA after a passing full test suite and an end-to-end Claude dry run (Actions run $GITHUB_RUN_ID)." \
            -m "Co-Authored-By: WOZCODE <contact@withwoz.com>"
          git push origin HEAD:master                                       # plain push: rejected if master moved
          echo "- MERGED into master as $(git rev-parse --short HEAD) (squash of $EXPECTED_BRANCH_SHA). Next 6 PM run uses it." >> summary.md

      - name: Publish report and logs
        if: always() && steps.claim.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f summary.md ] || echo "# Verification aborted before any check ran" > summary.md
          echo "- Job status: $JOB_STATUS. Logs: artifact 'verify-logs' on this run." >> summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = "schedule" ]; then
            gh issue create --title "SEO fallback verification: ${JOB_STATUS^^}" --body-file summary.md || true
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.claim.outputs.go == 'true'
        with:
          name: verify-logs
          path: |
            agent.log
            pytest.log
            summary.md
          if-no-files-found: ignore
          retention-days: 30
