<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/blog/blog.css">
<link rel="stylesheet" href="/assets/landing.css">
<style>
.cmp .lp-hero{grid-template-columns:1fr}
.cmp .lp-hero h1{max-width:18ch}
.cmp-table{max-width:1000px}
.cmp-table th,.cmp-table td{padding:14px 16px;font-size:16px;line-height:1.5;min-width:150px}
.cmp-table th{font:600 16px/1.3 var(--disp);color:#000}
.cmp-table tbody th{background:#fff;min-width:130px}
.cmp-note{font-size:14px;color:var(--body);max-width:720px}
.cmp-cards{list-style:none;padding:0;margin:24px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.cmp-cards li{background:#fff;border-radius:20px;padding:28px}
.cmp-cards a{display:block;margin-bottom:8px;color:#000;font:600 22px/1.15 var(--disp);text-decoration:none}
.cmp-cards a:hover{color:var(--primary)}
.cmp-cards p{margin:0;font-size:16px}
.cmp-cards .small{margin-top:10px}
</style>
{{analytics}}
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bh"><div class="wrap bh-in"><a class="brand" href="/">{{brand}}</a><nav aria-label="Main"><a href="/#how-it-works">How it works</a><a href="/blog/">Style guides</a><a class="cta-sm" href="{{app_url}}" target="_blank" rel="noopener" data-cta="play-store" data-placement="header">Get the app</a></nav></div></header>
<main id="main" class="wrap landing cmp">
<nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>
<section class="lp-hero">
<div class="lp-hero-text">
<h1>{{h1}}</h1>
<p class="lede">{{lede}}</p>
{{hero_cta}}
<p class="small">Free on Android</p>
</div>
</section>
{{body}}
<aside class="app-cta" aria-label="Get the app">
<p class="app-cta-title">{{cta_title}}</p>
<p>{{cta_text}}</p>
{{end_cta}}
<p class="small">Free on Android</p>
</aside>
{{more}}
</main>
<footer class="bf"><div class="wrap"><p><a href="/">{{brand}}</a> · <a href="/blog/">Style guides</a> · <a href="/compare/">Compare apps</a> · <a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms of Service</a></p></div></footer>
</body>
</html>
