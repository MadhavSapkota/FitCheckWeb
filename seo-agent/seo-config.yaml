content:
  provider: anthropic
  model: "claude-sonnet-5-5"        # writer/planner (Claude Sonnet 5.5)
  review_model: "claude-sonnet-5-5" # independent reviewer
  min_words: 900
  max_words: 2200
  max_keyword_density_percent: 2.5
  max_similarity_to_existing: 0.45   # 0..1 shingle similarity; above this = near-duplicate
  # Duplicate prevention is INTENT-based (seo_agent/intent.py): same feature + same intent type (tool vs informational)
  # + strong normalized overlap. Shared words with a landing page or article never block a keyword on their own.
  max_revisions: 3                   # rejected drafts are rewritten with the reviewer's exact feedback, then re-reviewed

publishing:
  automatic: true
  max_new_articles_per_day: 1        # at most ONE quality article per day; none when nothing qualifies
  update_existing_pages: true
  require_quality_gate: true
  max_page_updates_per_day: 2

limits:                               # spending guardrails (checked before every Claude call)
  max_claude_calls_per_run: 30        # up to 4 candidates tried x (plan + write + review + revisions), 1 published
  max_monthly_usd: 25                 # stop generating when the month's estimated spend reaches this
  input_usd_per_mtok: 3.0             # VERIFY against https://www.anthropic.com/pricing for your model
  output_usd_per_mtok: 15.0
  # Also set a hard monthly limit in console.anthropic.com -> Settings -> Limits.

analytics:
  # Optional CTA click tracking (GA4). Leave empty to disable. Enabling adds Google Analytics to /blog/ pages
  # only - update privacy.html to disclose it first.
  ga4_measurement_id: "G-NQ0WXQQXQW" # same tag + consent banner as the rest of the site (disclosed in privacy.html)
  ga4_property_id: ""                # numeric GA4 property id, to read play_store_click counts into the daily report

seo:
  generate_meta_tags: true
  generate_sitemap: true
  add_internal_links: true
  canonical_urls: true
  monitor_search_console: true
  search_console_property: "sc-domain:fitcheck-fashion.com"   # or "https://fitcheck-fashion.com/"
  low_ctr_threshold: 0.015
  min_impressions_for_improvement: 100
