# Editable configuration for the daily SEO agent (seo_agent/).
project:
  name: "Style AI Fit Check"
  brand_on_site: "FitCheck AI"
  app_url: "https://play.google.com/store/apps/details?id=com.aistyleassistant.app"

site:
  base_url: "https://fitcheck-fashion.com"   # no trailing slash
  domain: "fitcheck-fashion.com"
  root_dir: "."                              # repo folder served by GitHub Pages
  blog_dir: "blog"
  # Hand-built pages listed in the sitemap. The agent never rewrites their layout.
  static_pages: ["index.html", "how-it-works.html", "privacy.html", "terms.html"]
  exclude_from_audit: ["hero.html"]          # component fragment, not a standalone page

schedule:
  frequency: daily

keyword_research:
  source: google_ads_keyword_planner        # or: dataforseo_labs (labeled alternative)
  fallback_source: ""                       # "dataforseo_labs" = paid alternative if Google Ads fails; "" disables
  # Organic difficulty source:
  #   none       -> LOW-COST mode (default). Keyword Planner has NO organic difficulty, so none is reported.
  #                 A clearly labeled heuristic "opportunity estimate" (0-100) is computed from real evidence:
  #                 long-tail length, question format, verified volume band, relevance, Search Console rankings.
  #   dataforseo -> paid: measured organic keyword difficulty + live top-10 SERP.
  organic_difficulty_source: none
  min_opportunity_estimate: 50
  # Search Console queries with no verified volume are allowed only with this much real demand evidence:
  min_gsc_impressions_if_volume_unverified: 30
  max_candidates_per_run: 3          # each candidate costs ~3 Claude calls
  # Google Trends: no official API exists, so it is intentionally not used (unofficial scrapers break ToS/reliability).
  minimum_monthly_searches: 100
  maximum_organic_difficulty: 25   # applies when organic_difficulty_source: dataforseo
  language: en
  language_constant: "languageConstants/1000"   # Google Ads: English
  location: US
  location_code: 2840                           # Google Ads geo target / DataForSEO location (United States)
  max_ideas_per_run: 400
  allowed_intents: ["informational", "commercial"]
  seed_keywords:
    - ai outfit checker
    - ai fit check
    - outfit rating
    - outfit color matching
    - fashion ai
    - outfit analyzer
    - ai fashion stylist
    - personal styling
    - makeup ai
    - beauty ai
    - hairstyle try on
    - outfit ideas
  # A keyword must contain at least one of these terms to be considered relevant.
  relevance_terms: [outfit, fit, style, styling, stylist, fashion, wear, clothes, clothing, color, colour,
                    makeup, beauty, hair, hairstyle, look, wardrobe, closet, dress, jeans, shoes, sneakers]
  blocked_terms: [porn, nude, casino, crack, torrent, apk download, mod apk]

content:
  provider: anthropic
  model: "claude-sonnet-5-5"        # writer/planner (Claude Sonnet 5.5)
  review_model: "claude-sonnet-5-5" # independent reviewer
  min_words: 900
  max_words: 2200
  max_keyword_density_percent: 2.5
  max_similarity_to_existing: 0.45   # 0..1 shingle similarity; above this = near-duplicate
  coverage_threshold: 0.6            # share of keyword tokens already in an existing title/H1 = "covered"

publishing:
  automatic: true
  max_new_articles_per_day: 1
  update_existing_pages: true
  require_quality_gate: true
  max_page_updates_per_day: 2

limits:                               # spending guardrails (checked before every Claude call)
  max_claude_calls_per_run: 12
  max_monthly_usd: 10                 # stop generating when the month's estimated spend reaches this
  input_usd_per_mtok: 3.0             # VERIFY against https://www.anthropic.com/pricing for your model
  output_usd_per_mtok: 15.0
  # Also set a hard monthly limit in console.anthropic.com -> Settings -> Limits.

analytics:
  # Optional CTA click tracking (GA4). Leave empty to disable. Enabling adds Google Analytics to /blog/ pages
  # only - update privacy.html to disclose it first.
  ga4_measurement_id: ""             # e.g. "G-ABC123XYZ"
  ga4_property_id: ""                # numeric GA4 property id, for reading cta_click counts

seo:
  generate_meta_tags: true
  generate_sitemap: true
  add_internal_links: true
  canonical_urls: true
  monitor_search_console: true
  search_console_property: "sc-domain:fitcheck-fashion.com"   # or "https://fitcheck-fashion.com/"
  low_ctr_threshold: 0.015
  min_impressions_for_improvement: 100
