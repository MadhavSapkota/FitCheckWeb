    cta: {button: "Try Makeup Looks Live",
          text: "Use the live camera to preview makeup looks on your own face before you commit."}
  hairstyle-recommendations:
    label: "Hairstyle recommendations"
    landing: "/ai-hairstyle-try-on/"
    conversion: 75
    mix: 5
    phrases: [hairstyle suits me, haircut suits me, hairstyle suits my face, hairstyle for my face, hairstyles for face shape,
              hairstyle for face shape, haircut for face shape, haircuts for face shape, hairstyle for round face,
              haircut for round face, hairstyle for oval face, what hairstyle, which hairstyle, what haircut, which haircut,
              hairstyle ideas, haircut ideas, hair color for skin tone, hair colour for skin tone, hair color ideas]
    terms: [hair, hairstyle, hairstyles, haircut, haircuts, bangs, fringe, bob, layers, curls, curly, braids, pixie]
    seeds: [what hairstyle suits me, hairstyles for my face shape, haircut for round face, hair color for my skin tone,
            haircut ideas]
    cta: {button: "Find Hairstyles That Suit You",
          text: "Explore hairstyle, curl, and hair color ideas and see how a look comes together on you."}
  hairstyle-try-on:
    label: "Virtual hairstyle try-on"
    landing: "/ai-hairstyle-try-on/"
    conversion: 92
    mix: 6
    phrases: [hairstyle try on, hairstyles try on, try on hairstyles, try on hairstyle, try hairstyles, try a hairstyle,
              try on different hairstyles, try different hairstyles, hair style try on, try on hair styles,
              try hair styles, hair style app, hair style filter, hair style simulator,
              haircut try on, try on haircut, try on haircuts, hair try on, hairstyle simulator, haircut simulator,
              haircut filter, hairstyle filter, hair filter, hairstyle app, haircut app, virtual hairstyle, virtual haircut,
              virtual hair, hair color try on, try hair color, try on hair color, hairstyles on my face, hairstyles on your face,
