# Editable configuration for the daily SEO agent (seo_agent/).
project:
  name: "Style AI Fit Check"
  brand_on_site: "FitCheck AI"
  app_url: "https://play.google.com/store/apps/details?id=com.aistyleassistant.app"

site:
  base_url: "https://fitcheck-fashion.com"   # no trailing slash
  domain: "fitcheck-fashion.com"
  root_dir: "."                              # repo folder served by GitHub Pages
  blog_dir: "blog"
  # Hand-built pages listed in the sitemap. The agent never rewrites their layout.
  static_pages: ["index.html", "how-it-works.html", "privacy.html", "terms.html",
                 "ai-outfit-checker/index.html", "ai-makeup-assistant/index.html", "ai-hairstyle-try-on/index.html",
                 "digital-wardrobe/index.html", "virtual-outfit-try-on/index.html", "ai-skin-analysis/index.html"]
  exclude_from_audit: ["hero.html"]          # component fragment, not a standalone page
  # Tool-intent queries a hand-built page already satisfies (feature landing pages declare theirs in landing_pages.yaml).
  page_targets:
    index.html: [fitcheck, fitcheck app, fitcheck ai, fit check app, fitcheck ai app, style ai fit check]
  # Meta descriptions added ONLY when a hand-built page has none (og:title/og:description/twitter:card are derived).
  static_meta:
    how-it-works.html: "How FitCheck AI works: upload a head-to-toe outfit photo, get an AI style score, and see tips on fit, color match and balance."

schedule:
  frequency: daily

keyword_research:
  source: google_ads_keyword_planner        # or: dataforseo_labs (labeled alternative)
  fallback_source: ""                       # "dataforseo_labs" = paid alternative if Google Ads fails; "" disables
  # Organic difficulty source:
  #   none       -> LOW-COST mode (default). Keyword Planner has NO organic difficulty, so none is reported.
  #                 A clearly labeled heuristic "opportunity estimate" (0-100) is computed from real evidence:
  #                 long-tail length, question format, verified volume band, relevance, Search Console rankings.
  #   dataforseo -> paid: measured organic keyword difficulty + live top-10 SERP.
  organic_difficulty_source: none
  # Legacy single-number threshold; still applied to editorial topics. Regular keywords use `scoring:` below.
  min_opportunity_estimate: 50
  # Search Console queries with no verified volume are allowed only with this much real demand evidence:
  min_gsc_impressions_if_volume_unverified: 30
  # When NO volume source works (no Google Ads, no Search Console data yet), Claude proposes long-tail
  # question topics from the seeds. They are labeled "volume unverified"; no metrics are invented.
  # All relevance, duplicate and quality-gate checks still apply. Set enabled: false to require verified data.
  unverified_topics:
    enabled: false                 # OFF: verified data sources only (owner's choice)
    min_opportunity_estimate: 40   # needs 5+ words, question format, and app relevance
  max_candidates_per_run: 4          # each candidate costs 3 Claude calls + 2 per revision
  # Duplicate intent: a keyword is skipped when a published article's target/secondary query overlaps this much
  # (token Jaccard). Any feature: cluster_duplicate_overlap. Same feature: same_feature_overlap (stricter).
  cluster_duplicate_overlap: 0.6
  same_feature_overlap: 0.5
  # Google Trends: no official API exists, so it is intentionally not used (unofficial scrapers break ToS/reliability).
  minimum_monthly_searches: 100
  maximum_organic_difficulty: 25   # applies when organic_difficulty_source: dataforseo
  language: en
  language_constant: "languageConstants/1000"   # Google Ads: English
  location: US
  location_code: 2840                           # Google Ads geo target / DataForSEO location (United States)
  # Keyword Planner is queried once PER FEATURE (features.*.seeds) so broad "outfit ideas" seeds can no longer
  # crowd out makeup, skin, wardrobe, and try-on ideas. This cap applies to each feature's request group.
  max_ideas_per_run: 150
  allowed_intents: ["informational", "commercial"]
  # Extra general seeds (in addition to every feature's seeds below).
  seed_keywords:
    - ai fashion stylist
    - personal styling
  # Relevance comes from the `features:` map below (a keyword must match a FitCheck feature).
  blocked_terms: [porn, nude, casino, crack, torrent, apk download, mod apk, costume, wig, tattoo,
                  surgery, botox, filler, acne treatment, hair loss treatment, prescription,
                  personal stylist, wardrobe stylist, image consultant, stylist near, stylist salary, stylist jobs]

# --------------------------------------------------------------------------------------------------------------
# Five-component keyword score (0-100 each). A transparent HEURISTIC to rank topics, NOT a Google ranking formula
# and NOT keyword difficulty. Every component and its evidence is stored in state.json and printed in reports.
scoring:
  weights: {feature_relevance: 0.30, ranking_opportunity: 0.25, search_demand: 0.15,
            conversion_potential: 0.20, content_usefulness: 0.10}
  min_total: 50                  # tested 40 / 45 / 50 on stored keywords (python -m seo_agent.main rescore): identical
                                 # results after the gates, so the stricter 50 is used; lower to 45 only if runs starve
  min_feature_relevance: 60      # needs a feature phrase or 2+ feature words; one loose word (55) is not enough
  min_ranking_opportunity: 25    # skips head terms a new domain cannot realistically rank for
  mix_boost_max: 5               # ranking points for features below their editorial-mix target
  mix_penalty_max: 10            # ranking points removed from features far above their target (topic diversity)

# --------------------------------------------------------------------------------------------------------------
# FitCheck features. Every keyword is classified into exactly one feature (highest relevance; ties -> listed first).
#   phrases: strong multi-word matches (relevance 95)   terms: single words (relevance 55, +15 per extra hit, max 85)
#   relevance_cap: lowers the ceiling for loosely related features (e.g. general trends)
#   conversion: base app-download potential 0-100      mix: editorial-mix target in % (flexible, not a quota)
#   landing: feature page articles link to (only when the file exists)   health: stricter medical-claim rules
features:
  outfit-checker:
    label: "AI FitCheck & live outfit check"
    landing: "/ai-outfit-checker/"
    conversion: 85
    mix: 25
    phrases: [fit check, outfit checker, outfit check, rate my outfit, rate my fit, rate outfit, outfit rating, outfit rater,
              outfit analyzer, outfit analysis, does my outfit look good, does this outfit look good, is my outfit good,
              what should i wear, what to wear today, outfit color, colors go together, colours go together, match colors,
              color matching, color combination, outfit matcher, outfit score, outfit feedback, ai stylist,
              ai personal stylist, ai fashion stylist, stylist app, styling app, style app, outfit app]
    # Only specific words here: generic words like "outfit" belong to `trends` (low conversion), and human-stylist
    # queries ("personal stylist near me") are not FitCheck's offer (app_facts: no human stylists).
    terms: [rate, rating, rater, checker, analyzer, color, colour, colors]
    seeds: [outfit checker, rate my outfit, does my outfit look good, what should i wear today, outfit color matching,
            what colors go together in an outfit, ai stylist, outfit rating app]
    cta: {button: "Check Your Outfit With AI",
          text: "Snap a head-to-toe photo and get an AI style score with tips on fit, color, and balance."}
  makeup-assistant:
    label: "AI makeup assistant"
    landing: "/ai-makeup-assistant/"
    conversion: 80
    mix: 8
    phrases: [makeup assistant, makeup advisor, makeup suits my face, makeup suits me, makeup for my face,
              makeup for skin tone, makeup for my skin tone, makeup recommendations, makeup suggestions, makeup analyzer,
              makeup analysis, makeup for face shape, makeup for my face shape, everyday makeup, natural makeup look,
              beauty assistant, makeup tips, makeup look, makeup looks]
    terms: [makeup, beauty, foundation, blush, eyeshadow, eyeliner, contour, concealer, glam, bronzer, highlighter]
    seeds: [what makeup suits my face, makeup for my skin tone, best makeup for my face shape, everyday makeup look,
            makeup recommendations, ai makeup]
    cta: {button: "Get AI Makeup Feedback",
          text: "Snap a close-up in natural light and get AI beauty feedback on your makeup look."}
  makeup-try-on:
    label: "Live virtual makeup try-on"
    landing: "/ai-makeup-assistant/"
    conversion: 90
    mix: 7
    phrases: [makeup try on, try on makeup, try makeup, makeup filter, makeup simulator, lipstick try on,
              try on lipstick, lipstick filter, virtual makeup, makeup app, makeup camera, test makeup, makeup preview]
    terms: [lipstick]
