  - slug: ai-skin-analysis
    nav: AI Skin Analysis
    features: [skin-analysis]
    targets: [ai skin analysis, ai skin analyzer, skin analysis app, skin analyzer app, ai skin scanner, live skin analysis]
    title: "AI Skin Analysis: Live Skin Tone & Type Check | FitCheck"
    meta: "Use your camera for a live AI skin overview, then pick makeup shades that suit your tone and undertone. Cosmetic guidance, not medical advice."
    h1: "AI skin analysis for your beauty routine"
    lede: "Use your camera for a live AI skin overview, then get cosmetic tips on makeup shades and routine ideas that suit your skin tone and undertone."
    images:
      - {src: "/assets/makeup/soft-makeup.webp", width: 720, height: 1282, alt: "Close-up portrait with soft, natural makeup"}
    steps_title: "How live skin analysis works"
    steps:
      - {title: "Use natural light.", text: "Face a window, remove filters, and hold the camera at eye level with a clean face or light makeup."}
      - {title: "Start the live analysis.", text: "Point the camera at your face and FitCheck analyzes your skin live."}
      - {title: "Read your overview.", text: "Get an AI overview of your skin with cosmetic beauty suggestions."}
      - {title: "Use it for makeup.", text: "Apply the tips to choose foundation, blush, and lip shades with the makeup assistant."}
    sections:
      - h2: "Skin tone vs. undertone"
        html: >-
          <p><strong>Skin tone</strong> is how light or deep your skin is. <strong>Undertone</strong> is the color beneath
          the surface: warm (golden or peachy), cool (pink or rosy), or neutral (a mix). Undertone matters more than tone
          when choosing foundation and makeup shades.</p>
          <ul><li><strong>Vein check:</strong> greenish veins often suggest warm, bluish suggest cool, and a mix suggests neutral.</li>
          <li><strong>Jewelry check:</strong> if gold flatters you more, you may be warm; if silver does, you may be cool.</li></ul>
      - h2: "Use your results for makeup"
        html: >-
          <p>Once you know your undertone, match foundation along the jawline in daylight, and choose blush and lip
          shades in the same temperature family. Then get feedback on the finished look with the
          <a href="/ai-makeup-assistant/">AI makeup assistant</a>.</p>
      - h2: "Not medical advice"
        html: >-
          <p>FitCheck's skin analysis is cosmetic guidance for beauty and makeup. It is not medical advice, it does not
          diagnose skin conditions, and it is not a substitute for a dermatologist. If you have concerns about a mole,
          rash, acne, or any change in your skin, see a dermatologist or doctor.</p>
    benefits:
      - {title: "Live and quick.", text: "Get a skin overview from your camera in moments."}
      - {title: "Better shade choices.", text: "Use tone and undertone tips when picking makeup."}
      - {title: "Connected to makeup.", text: "Move straight to makeup feedback in the same app."}
    limits_title: "Important limits"
    limits:
      - "Cosmetic guidance only. Not medical advice and not a diagnosis."
      - "Results depend on lighting and camera quality, so treat them as a starting point."
      - "See a dermatologist or doctor for any skin concern."
    faqs:
      - {q: "What does AI skin analysis tell me?", a: "It gives a cosmetic overview of your skin from your camera, with tips on tone, undertone, and makeup shades. It is not medical advice."}
      - {q: "How do I find my skin undertone?", a: "Look at your veins in daylight (greenish often means warm, bluish cool), compare gold and silver jewelry, or use FitCheck's live skin analysis as a starting point."}
      - {q: "Can the app detect skin conditions?", a: "No. FitCheck does not diagnose or detect skin conditions. See a dermatologist or doctor about any concern."}
      - {q: "Is AI skin analysis free?", a: "FitCheck is free to download on Google Play for Android. An iOS version is coming soon."}
    cta:
      title: "Get a live skin overview"
      text: "Use your camera for an AI skin overview and makeup shade tips. Cosmetic guidance, not medical advice."
      button: "Try Skin Analysis"
